name: 'Helm Deploy'
description: 'helm upgrade --install a chart from the checkout with layered values files'

inputs:
  release:
    description: 'Helm release name'
    required: true
  chart_path:
    description: 'Path to the chart directory in the checkout'
    required: true
  namespace:
    description: 'Target namespace'
    required: true
  values_files:
    description: 'Newline-separated values files, applied in order'
    required: false
    default: ''
  secrets_values_b64:
    description: 'Optional base64-encoded secrets values yaml, applied last'
    required: false
    default: ''
  set:
    description: 'Newline-separated key=value overrides (e.g. image.tag=uat-abc1234)'
    required: false
    default: ''
  timeout:
    description: 'Helm --timeout'
    required: false
    default: '10m'

runs:
  using: 'composite'
  steps:
    - name: Deploy
      shell: bash
      run: |
        set -euo pipefail

        ARGS=()
        while IFS= read -r f; do
          [ -z "$f" ] && continue
          ARGS+=(--values "$f")
        done <<< "$VALUES_FILES"

        if [ -n "$SECRETS_VALUES_B64" ]; then
          SECRETS_FILE="$RUNNER_TEMP/secrets-values.yaml"
          echo "$SECRETS_VALUES_B64" | base64 -d > "$SECRETS_FILE"
          chmod 600 "$SECRETS_FILE"
          ARGS+=(--values "$SECRETS_FILE")
        fi

        while IFS= read -r kv; do
          [ -z "$kv" ] && continue
          ARGS+=(--set "$kv")
        done <<< "$SET_OVERRIDES"

        if ls "$CHART_PATH"/charts/*.tgz >/dev/null 2>&1; then
          echo "Using committed chart dependencies in $CHART_PATH/charts/"
        else
          # Register any https chart repos referenced by Chart.lock so
          # `helm dependency build` can fetch them on a clean runner.
          if [ -f "$CHART_PATH/Chart.lock" ]; then
            grep -E '^\s*repository:' "$CHART_PATH/Chart.lock" | awk '{print $2}' | sort -u | while IFS= read -r repo; do
              case "$repo" in
                http://*|https://*)
                  helm repo add "dep-$(echo -n "$repo" | shasum | cut -c1-8)" "$repo" --force-update
                  ;;
              esac
            done
          fi
          helm dependency build "$CHART_PATH"
        fi

        helm upgrade --install "$RELEASE" "$CHART_PATH" \
          --namespace "$NAMESPACE" \
          --create-namespace \
          "${ARGS[@]}" \
          --wait \
          --timeout "$TIMEOUT"

        helm status "$RELEASE" --namespace "$NAMESPACE"
      env:
        RELEASE: ${{ inputs.release }}
        CHART_PATH: ${{ inputs.chart_path }}
        NAMESPACE: ${{ inputs.namespace }}
        VALUES_FILES: ${{ inputs.values_files }}
        SECRETS_VALUES_B64: ${{ inputs.secrets_values_b64 }}
        SET_OVERRIDES: ${{ inputs.set }}
        TIMEOUT: ${{ inputs.timeout }}
